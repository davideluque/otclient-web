name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:proxy
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:ci

  # Branch protection requires this single status for every PR.
  check:
    needs: [quality, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify quality and dependency audit results
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
        run: test "$QUALITY" = success && test "$SECURITY" = success

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#7c5cbf" />
    <title>OTClient Web</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #1a1a2e; color: #e0e0e0;
        font-family: system-ui, sans-serif;
      }
      main {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1rem;
        padding: 1rem;
      }
      h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
      p.tagline { color: #888; margin-bottom: 1.5rem; text-align: center; }
      a.entry {
        display: block; width: min(85vw, 340px); padding: 1.1rem 1rem;
        border-radius: 14px; text-decoration: none; text-align: center;
        font-size: 1.05rem; font-weight: bold;
      }
      a.play { background: #7c5cbf; color: #fff; }
      a.play:hover, a.play:active { background: #6a4caf; }
      a.browse {
        background: transparent; color: #e0e0e0;
        border: 2px dashed #555;
      }
      a.browse:hover, a.browse:active { border-color: #7c5cbf; }
      a .sub { display: block; font-weight: normal; font-size: 0.8rem; color: rgba(255,255,255,0.75); margin-top: 0.3rem; }
      a.browse .sub { color: #888; }
    </style>
  </head>
  <body>
    <main>
      <h1>OTClient Web</h1>
      <p class="tagline">Tibia 7.6 in your browser</p>
      <a class="entry play" href="jamera.html">▶ Play online<span class="sub">log in to the game server</span></a>
      <a class="entry browse" href="map.html">🗺 Browse the map<span class="sub">offline explorer — loads your saved assets instantly</span></a>
    </main>
  </body>
</html>

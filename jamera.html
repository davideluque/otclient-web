<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Classic startup handler runs before the module graph, including on a failed import.
      (function () {
        var params = new URLSearchParams(location.search);
        if (!(params.get('tv') === '1' || params.get('tv') !== '0' && /web0s/i.test(navigator.userAgent))) return;
        var ready = false, endpoint;
        if (params.get('tvlogs') === '1') {
          try {
            var proxy = new URL(params.get('proxy'));
            if (/^wss?:$/.test(proxy.protocol) && proxy.hostname === location.hostname)
              endpoint = proxy.origin.replace(/^ws/, 'http') + '/tv/log';
          } catch (_) { /* Optional log destination. */ }
        }
        window.addEventListener('tv-world-ready', function () {
          ready = true;
          var banner = document.querySelector('.tv-render-error');
          if (banner) banner.remove();
        });
        window.addEventListener('tv-world-left', function () { ready = false; });
        function report(kind, reason, fallback, locationInfo) {
          var message = typeof reason === 'string' ? reason : reason && typeof reason.message === 'string' ? reason.message : fallback;
          var entry = Object.assign({kind:kind, message:message.slice(0,1000),
            stack:reason && typeof reason.stack === 'string' ? reason.stack.slice(0,4000) : ''}, locationInfo);
          if (endpoint) fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)}).catch(function () {});
          if (ready) return;
          var banner = document.querySelector('.tv-render-error');
          if (!banner) {
            banner = document.createElement('p');
            banner.className = 'tv-render-error';
            banner.setAttribute('role','alert');
            banner.style.cssText = 'position:fixed;z-index:145;top:10%;left:10%;right:10%;padding:1em;background:#602d24;color:white';
            (document.body || document.documentElement).appendChild(banner);
          }
          banner.textContent = 'Game startup failed. ' + entry.message;
        }
        window.addEventListener('error', function (e) {
          if (e.target instanceof HTMLScriptElement) {
            report('error', null, 'Could not load ' + new URL(e.target.src,location.href).pathname);
          } else if (typeof e.message === 'string') {
            report('error',e.error,e.message,{source:(e.filename || '').split('/').pop().split(/[?#]/)[0],
              line:e.lineno,column:e.colno,type:e.error && e.error.name || 'Error'});
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) { report('unhandledrejection',e.reason,'Promise rejected'); });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OTClient Web — Play online</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#000000" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Prevent browser-initiated touch gestures (double-tap-to-zoom,
         pull-to-refresh). We handle pan, tap, long-press, and joystick
         ourselves. iOS Safari ignores user-scalable=no since iOS 10,
         so this CSS rule is the only reliable way. */
      html, body, canvas { touch-action: none; }
      /* Kill iOS long-press text selection + callout menu on game UI.
         Without -webkit-touch-callout, long-pressing the joystick or
         canvas pops up the "Copy/Look Up" sheet and selects nearby
         text. -webkit-user-select is the iOS Safari prefix that the
         unprefixed user-select doesn't cover. Inputs opt back in below
         so chat and the login form stay typable/selectable. */
      html, body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input, textarea, [contenteditable] {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
      /* `-webkit-fill-available` gives iOS Safari/PWA the actually-visible
         viewport height (post-status-bar layout), avoiding the
         pre-layout-measured `100%` that leaves a black strip at the top
         on installed PWAs. The plain `100%` line is the fallback for
         non-WebKit browsers. Black background: any sliver the canvas
         doesn't cover mid-rotation must read as letterbox, not page. */
      html, body {
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="jamera-root"></div>
    <script type="module" src="/src/lib/jamera/main.ts"></script>
  </body>
</html>
